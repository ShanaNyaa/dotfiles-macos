# Change prefix + r to reload tmux
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Change global prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# set -g prefix C-s

# ---------------------
# Display
# ---------------------
# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Automatically rename windows
setw -g automatic-rename on

# Set terminal title
set -g set-titles on
set -g set-titles-string "#S - #W"

# ---------------------
# Terminal & Colors
# ---------------------
# Enable 256-color support
set -g default-terminal "tmux-256color"

# Enable true color (24-bit)
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable Neovim cursor shape in tmux
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# ---------------------
# Mouse
# ---------------------
# Enable mouse support (tmux 2.1+)
set -g mouse on

# Intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation (prefix + h/j/k/l)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-style pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows without prefix using Alt+arrow
# bind -n M-Left previous-window
# bind -n M-Right next-window

# Switch windows without prefix using Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Switch panes without prefix using Alt+h/j/k/l
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R
bind -n M-h if-shell -F "#{pane_at_left}" "" "select-pane -L"
bind -n M-j if-shell -F "#{pane_at_bottom}" "" "select-pane -D"
bind -n M-k if-shell -F "#{pane_at_top}" "" "select-pane -U"
bind -n M-l if-shell -F "#{pane_at_right}" "" "select-pane -R"

# Vi mode for copy mode
setw -g mode-keys vi

# Vim-like key bindings for selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi V send-keys -X select-line

# Cross-platform clipboard integration
if-shell "uname | grep -q Darwin" \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'

# Allow applications like Neovim to write to the system clipboard
set -s set-clipboard on

# Allow OSC 52 escape sequence to pass through tmux boundaries
set -g allow-passthrough on

# Let tmux pass xterm-style key sequences through
set -g xterm-keys on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ======================
# Plugin Settings
# ======================

# tmux-resurrect: restore pane contents and vim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-save and auto-restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin theme for tmux
set -g @plugin 'catppuccin/tmux#v2.3.0'

source-file ~/.config/tmux/theme.conf

# Load catppuccin
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Fix for Catppuccin message-style corrupting tmux 3.7 command-prompt
# which based on:
# https://github.com/catppuccin/tmux/issues/600
set -gF message-style 'fg=#{@thm_teal},bg=default,fill=#{@thm_bg}'
set -gF message-command-style 'fg=#{@thm_teal},bg=default,fill=#{@thm_bg}'
